name: CI — Lint, Format, Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Lint, Format and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start static server
        run: |
          npx http-server docs -p 3000 &
          sleep 1
          echo "Waiting for http://localhost:3000 to be available..."
          npx wait-on http://localhost:3000 --timeout 30000
          echo "Server started. Listing processes and port bindings for debug:"
          ps aux | sed -n '1,200p' || true
          ss -ltnp | sed -n '1,200p' || netstat -tulpn || true
          curl --retry 6 --retry-delay 2 --fail -v http://localhost:3000 || (echo 'curl failed' && exit 1)

      - name: Run tests
        run: npm test
